<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficJus Drive — Completar Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
    .auth-box { width: 100%; max-width: 32rem; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(59, 130, 246, 0.12); border-radius: 1.5rem; padding: 2.5rem 2rem; backdrop-filter: blur(12px); }
    .auth-box h1 { font-family: 'Merriweather', Georgia, serif; font-size: 1.25rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 0.25rem; }
    .auth-box .subtitle { font-size: 0.875rem; color: #94a3b8; text-align: center; margin-bottom: 2rem; }
    .auth-box label { display: block; font-size: 0.8125rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.375rem; }
    .auth-box input, .auth-box select { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid rgba(59, 130, 246, 0.15); background: rgba(10, 22, 40, 0.6); color: #f1f5f9; font-size: 0.9375rem; font-family: inherit; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
    .auth-box input:focus, .auth-box select:focus { border-color: #3b82f6; }
    .auth-box .form-group { margin-bottom: 1.25rem; }
    .auth-box .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .auth-box .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .auth-box .btn-submit { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: none; background: #2563eb; color: #fff; font-size: 0.9375rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; }
    .auth-box .btn-submit:hover { background: #3b82f6; }
    .auth-box .btn-submit:disabled { background: #1e3a5f; color: #64748b; cursor: not-allowed; }
    .auth-box .btn-small { padding: 0.5rem 1rem; font-size: 0.8125rem; border-radius: 0.5rem; border: 1px solid rgba(59, 130, 246, 0.2); background: rgba(59, 130, 246, 0.1); color: #93c5fd; cursor: pointer; }
    .auth-box .btn-small:hover { background: rgba(59, 130, 246, 0.2); }
    .auth-box .msg { display: none; font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: 0.75rem; margin-bottom: 1rem; text-align: center; }
    .auth-box .msg-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .auth-box .msg-success { background: rgba(5, 150, 105, 0.1); border: 1px solid rgba(5, 150, 105, 0.2); color: #6ee7b7; }
    .auth-box .section-title { font-size: 1rem; font-weight: 700; color: #e2e8f0; margin: 1.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(59, 130, 246, 0.1); }
    .auth-box .section-title:first-of-type { margin-top: 0; }
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); align-items: center; justify-content: center; z-index: 100; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link { display: block; text-align: center; font-size: 0.8125rem; color: #64748b; margin-top: 1rem; }
    .back-link a { color: #3b82f6; }
    .foto-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(59, 130, 246, 0.3); margin-top: 0.5rem; }
    @media (max-width: 640px) {
      .auth-box .form-row, .auth-box .form-row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-box">
      <h1>Completar Cadastro</h1>
      <p class="subtitle">OficJus Drive • Preencha seus dados</p>

      <div class="msg msg-error" id="errorMsg"></div>
      <div class="msg msg-success" id="successMsg"></div>

      <form id="profileForm">
        <!-- Dados Pessoais -->
        <div class="section-title">📋 Dados Pessoais</div>

        <div class="form-group">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15">
          </div>
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" placeholder="Número da matrícula">
        </div>

        <div class="form-group">
          <label for="foto">Foto de perfil</label>
          <input type="file" id="foto" accept="image/*" style="font-size:0.875rem;color:#94a3b8;padding:0.5rem 0;">
          <img id="fotoPreview" class="foto-preview" style="display:none">
        </div>

        <!-- Endereço -->
        <div class="section-title">🏠 Endereço</div>

        <div class="form-row">
          <div class="form-group">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
          </div>
          <div style="display:flex;align-items:flex-end;">
            <button type="button" class="btn-small" id="btnBuscarCEP" style="margin-bottom:1.25rem;">Buscar</button>
          </div>
        </div>

        <div class="form-group">
          <label for="rua">Logradouro</label>
          <input type="text" id="rua" placeholder="Rua, Av., Trav.">
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label for="numero">Número</label>
            <input type="text" id="numero" placeholder="Nº">
          </div>
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
          </div>
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade">
          </div>
        </div>

        <div class="form-group">
          <label for="uf">UF</label>
          <input type="text" id="uf" placeholder="MG" maxlength="2" style="max-width:80px;">
        </div>

        <button type="submit" class="btn-submit">Salvar dados</button>
      </form>

      <div class="back-link">
        <a href="index.html">← Voltar para o site</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
