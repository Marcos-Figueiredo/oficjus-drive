<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficJus Driver — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
    .auth-box { width: 100%; max-width: 28rem; background: rgba(15,23,42,0.8); border: 1px solid rgba(59,130,246,0.12); border-radius: 1.5rem; padding: 2.5rem 2rem; backdrop-filter: blur(12px); }
    .auth-box h1 { font-family: 'Merriweather', Georgia, serif; font-size: 1.25rem; font-weight: 700; color: #fff; text-align: center; margin-bottom: 0.5rem; }
    .auth-box p.sub { font-size: 0.875rem; color: #94a3b8; text-align: center; margin-bottom: 1.5rem; }
    .auth-box label { display: block; font-size: 0.8125rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.375rem; }
    .auth-box input { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid rgba(59,130,246,0.15); background: rgba(10,22,40,0.6); color: #f1f5f9; font-size: 0.9375rem; font-family: inherit; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
    .auth-box input:focus { border-color: #3b82f6; }
    .auth-box .form-group { margin-bottom: 1.25rem; }
    .auth-box .btn-submit { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: none; background: #2563eb; color: #fff; font-size: 0.9375rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .auth-box .btn-submit:hover { background: #3b82f6; }
    .auth-box .btn-submit:disabled { background: #1e3a5f; color: #64748b; cursor: not-allowed; }
    .auth-box .msg { display: none; font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: 0.75rem; margin-bottom: 1rem; text-align: center; }
    .auth-box .msg-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; }
    .auth-box .msg-success { background: rgba(5,150,105,0.1); border: 1px solid rgba(5,150,105,0.2); color: #6ee7b7; }
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-box .link { text-align: center; font-size: 0.8125rem; color: #64748b; margin-top: 1rem; }
    .auth-box .link a { color: #3b82f6; text-decoration: none; }
    .auth-box .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
  <div class="auth-wrapper">
    <div class="auth-box">
      <h1>J&aacute; tem conta?</h1>
      <p class="sub">Fa&ccedil;a login para baixar o APK novamente</p>

      <div class="msg" id="errorMsg"></div>
      <div class="msg" id="successMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Entrar</button>
      </form>

      <div class="link">
        <a href="cadastro.html">Criar conta gratuita</a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://weaqkaaqalvpbxkxrfee.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlYXFrYWFxYWx2cGJ4a3hyZmVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzUyNzU4NjIsImV4cCI6MjA1MDg1MTg2Mn0.BsW5BdsOXIqqlxKD5sgJ8g8tT5Q1LfIW7A5WZR340qE';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const loadingOverlay = document.getElementById('loadingOverlay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      loadingOverlay.classList.add('active');

      try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: senhaInput.value,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error_description || data.error || 'Erro ao fazer login.');
        }

        // Login OK — redireciona para download
        loadingOverlay.classList.remove('active');
        window.location.href = 'download.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        loadingOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
