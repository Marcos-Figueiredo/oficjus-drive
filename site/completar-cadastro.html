<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OficJus Driver — Completar Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { background: #0b1120; color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
    .header-bar { background: rgba(15,23,42,0.9); border-bottom: 1px solid rgba(59,130,246,0.12); padding: 1rem 1.5rem; text-align: center; }
    .header-bar h1 { font-family: 'Merriweather', Georgia, serif; font-size: 1.125rem; font-weight: 700; color: #fff; margin: 0; }
    .header-bar p { font-size: 0.8125rem; color: #64748b; margin: 0.25rem 0 0; }
    .form-wrapper { max-width: 36rem; margin: 2rem auto; padding: 0 1.5rem 3rem; }
    .card { background: rgba(15,23,42,0.8); border: 1px solid rgba(59,130,246,0.12); border-radius: 1.5rem; padding: 2rem; backdrop-filter: blur(12px); }
    .card h2 { font-size: 1.125rem; font-weight: 700; color: #fff; margin: 1.5rem 0 1rem; }
    .card h2:first-child { margin-top: 0; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8125rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.375rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid rgba(59,130,246,0.15); background: rgba(10,22,40,0.6); color: #f1f5f9; font-size: 0.9375rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }
    .form-group select { appearance: auto; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem; }
    .btn-submit { width: 100%; padding: 0.875rem; border-radius: 0.75rem; border: none; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 1rem; }
    .btn-submit:hover { background: #3b82f6; }
    .btn-submit:disabled { background: #1e3a5f; color: #64748b; cursor: not-allowed; }
    .msg { display: none; font-size: 0.875rem; padding: 0.75rem 1rem; border-radius: 0.75rem; margin-bottom: 1rem; text-align: center; }
    .msg-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #fca5a5; }
    .msg-success { background: rgba(5,150,105,0.1); border: 1px solid rgba(5,150,105,0.2); color: #6ee7b7; }
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foto-area { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .foto-area .preview { width: 80px; height: 80px; border-radius: 50%; border: 2px dashed rgba(59,130,246,0.3); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(10,22,40,0.6); flex-shrink: 0; }
    .foto-area .preview img { width: 100%; height: 100%; object-fit: cover; }
    .foto-area .preview .placeholder { font-size: 1.5rem; color: #475569; }
    .foto-area label { padding: 0.5rem 1rem; border-radius: 0.75rem; border: 1px solid rgba(59,130,246,0.2); background: rgba(10,22,40,0.6); color: #cbd5e1; font-size: 0.8125rem; cursor: pointer; }
    .foto-area label:hover { border-color: #3b82f6; }
    .foto-area input[type="file"] { display: none; }
    .inline-flex { display: flex; align-items: center; gap: 0.5rem; }
    .text-xs { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

  <div class="header-bar">
    <h1>OficJus Driver</h1>
    <p>Complete seu cadastro para começar</p>
  </div>

  <div class="form-wrapper">
    <div class="card">
      <div class="msg" id="errorMsg"></div>
      <div class="msg" id="successMsg"></div>

      <form id="profileForm">
        <h2>Dados pessoais</h2>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome" readonly>
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" readonly>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15">
          </div>
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula / CPF do cartório</label>
          <input type="text" id="matricula" placeholder="Número da matrícula">
        </div>

        <div class="foto-area">
          <div class="preview" id="fotoPreview">
            <span class="placeholder">📷</span>
          </div>
          <div>
            <label for="fotoInput">📸 Adicionar foto</label>
            <input type="file" id="fotoInput" accept="image/*">
            <div class="text-xs">Opcional — será usada no perfil</div>
          </div>
        </div>

        <h2>Endereço</h2>

        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label for="cep">CEP</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
          </div>
          <div class="form-group" style="flex:1">
            <label for="numero">Número</label>
            <input type="text" id="numero" placeholder="Nº">
          </div>
        </div>

        <div class="form-group">
          <label for="rua">Logradouro</label>
          <input type="text" id="rua" placeholder="Rua, Av...">
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">
          </div>
          <div class="form-group">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade">
          </div>
          <div class="form-group">
            <label for="uf">UF</label>
            <select id="uf">
              <option value="">UF</option>
              <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
              <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
              <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
              <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
              <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
              <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
              <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
              <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
              <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
            </select>
          </div>
        </div>

        <h2>Dados do CNJ</h2>

        <div class="form-row-3">
          <div class="form-group">
            <label for="j">Segmento (J)</label>
            <select id="j">
              <option value="">Selecione</option>
              <option value="8">8 — Justiça Estadual</option>
              <option value="9">9 — Justiça Federal</option>
              <option value="4">4 — Justiça do Trabalho</option>
              <option value="5">5 — Justiça Eleitoral</option>
              <option value="6">6 — Justiça Militar</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tr">Tribunal (TR)</label>
            <input type="text" id="tr" placeholder="Ex: 01" maxlength="2">
          </div>
          <div class="form-group">
            <label for="oooo">Comarca (OOOO)</label>
            <input type="text" id="oooo" placeholder="Ex: 0001" maxlength="4">
          </div>
        </div>

        <h2>Valores de custas</h2>
        <div class="form-row">
          <div class="form-group">
            <label for="valor_urbano">Valor diligência urbana</label>
            <input type="text" id="valor_urbano" placeholder="R$ 0,00">
          </div>
          <div class="form-group">
            <label for="valor_rural">Valor diligência rural</label>
            <input type="text" id="valor_rural" placeholder="R$ 0,00">
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Salvar e continuar</button>
      </form>
    </div>
  </div>

  <script src="completar-cadastro.js"></script>
</body>
</html>
