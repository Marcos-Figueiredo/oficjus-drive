<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmando seu cadastro...</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 0.9375rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Confirmando seu cadastro...</p>
  </div>
  <script>
    (async function() {
      const SUPABASE_URL = 'https://weaqkaaqalvpbxkxrfee.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlYXFrYWFxYWx2cGJ4a3hyZmVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzUyNzU4NjIsImV4cCI6MjA1MDg1MTg2Mn0.BsW5BdsOXIqqlxKD5sgJ8g8tT5Q1LfIW7A5WZR340qE';

      const params = new URLSearchParams(window.location.hash.replace('#', '&'));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      if (accessToken && (type === 'signup' || type === 'email_confirm' || type === 'invite')) {
        try {
          // Salva token
          localStorage.setItem('sb-access-token', accessToken);
          if (refreshToken) localStorage.setItem('sb-refresh-token', refreshToken);

          // Extrai user_id diretamente do JWT (payload base64 entre os dois pontos)
          // Nao depende de API, funciona sempre
          var parts = accessToken.split('.');
          if (parts.length === 3) {
            try {
              var payload = JSON.parse(atob(parts[1]));
              if (payload.sub) {
                localStorage.setItem('drv_user_id', payload.sub);
              }
            } catch (e) { /* ignora erro de parse */ }
          }

          // Fallback: tenta buscar via API
          if (!localStorage.getItem('drv_user_id')) {
            try {
              var res = await fetch(SUPABASE_URL + '/auth/v1/user', {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + accessToken },
              });
              var userData = await res.json();
              if (userData && userData.id) {
                localStorage.setItem('drv_user_id', userData.id);
              }
            } catch (e) { /* ignora */ }
          }
        } catch (e) { /* ignora */ }
      }

      // Redireciona para completar cadastro (mantendo o hash com o token)
      window.location.href = 'completar-cadastro.html' + window.location.hash;
    })();
  </script>
</body>
</html>
