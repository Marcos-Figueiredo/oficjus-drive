<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmando seu cadastro...</title>
  <style>
    body { margin: 0; background: #0f172a; color: #f1f5f9; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 0.9375rem; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Confirmando seu cadastro...</p>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.hash.replace('#', '&'));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      // Se veio com token, tenta confirmar
      if (accessToken && type === 'signup') {
        try {
          // Salva token para usar depois
          localStorage.setItem('sb-access-token', accessToken);
          if (refreshToken) localStorage.setItem('sb-refresh-token', refreshToken);
        } catch {}
      }

      // Redireciona para completar cadastro (mantendo o hash com o token)
      window.location.href = 'completar-cadastro.html' + window.location.hash;
    })();
  </script>
</body>
</html>
